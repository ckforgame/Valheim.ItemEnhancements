## Settings file for Valheim Item Enhancements (MMORPG Refinement Mod)
## Plugin GUID: ckforgame.ItemEnhancements
##
## =========================================================================================
## ℹ️ ข้อมูลการตั้งค่าอัตราต่าง ๆ (Configuration Notice)
## =========================================================================================
## การตั้งค่าอัตราความสำเร็จ (Success Rates), สเตตัสพิเศษของอาวุธ/เกราะ/โล่ (Abilities),
## คัมภีร์และการดรอป (Scrolls & Drops) และโหมดโกง (Cheat Abilities) ทั้งหมด
## ได้รับการย้ายไปจัดเก็บในโฟลเดอร์ไฟล์ YAML:
##
##     BepInEx/config/ckforgame.ItemEnhancements/
##         ├── Success.yml   (อัตราสำเร็จ, กฎการล้มเหลว, คัมภีร์, การดรอป)
##         ├── Item.yml      (อาวุธ, ความทนทาน, น้ำหนัก, เครื่องประดับ)
##         ├── Armor.yml     (ชุดเกราะ, โล่, ความคล่องตัว)
##         └── Cheat.yml     (โหมดโกง Capacity เลือด/สเตมินา/พลังเวท และรีเจน)
##
## 🛡️ ป้องกันการอัปเดตม็อดเขียนทับการตั้งค่าของคุณ (Override Files):
## หากต้องการปรับแต่งค่าโดยไม่ให้การอัปเดตม็อดเขียนทับค่าของคุณ ให้สร้างไฟล์ override เช่น:
##     - Success.override.yml
##     - Item.override.yml
##     - Armor.override.yml
##     - Cheat.override.yml
## ระบบจะนำค่าจากไฟล์ override มาเขียนทับค่าเริ่มต้นอัตโนมัติ และรองรับ Hot-Reload ทันทีที่เซฟ!
## =========================================================================================

[1. General & UI (การตั้งค่าทั่วไปและปุ่มลัด)]

## ปุ่มลัดสำหรับเปิด/ปิดหน้าต่างตีบวก (Shortcut key to toggle enhancement window, e.g. F8, U, Insert)
# Setting type: KeyCode
# Default value: F8
ToggleGuiKey = F8

## แสดงป้ายระดับ +X สีตามเทียร์บนไอคอนในกระเป๋า (Show tier-colored level badge on inventory icons)
# Setting type: Boolean
# Default value: true
ShowInventoryBadges = true
