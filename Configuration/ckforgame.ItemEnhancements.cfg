## Settings file for Valheim Item Enhancements (MMORPG Refinement Mod)
## Plugin GUID: ckforgame.ItemEnhancements
##
## =========================================================================================
## ℹ️ Configuration Notice
## =========================================================================================
## Success rates, item ability bonuses (weapons/armor/shields), scrolls & monster drops,
## and cheat abilities are managed via external YAML files located at:
##
##     BepInEx/config/ckforgame.ItemEnhancements/
##         ├── Success.yml   (Success rates, failure penalties, scroll & coin costs)
##         ├── Drops.yml     (Monster & boss scroll drop rates)
##         ├── Item.yml      (Weapons, tools, durability, weight, and utility accessories)
##         ├── Armor.yml     (Armor, shields, movement, and stamina/eitr modifiers)
##         └── Cheat.yml     (Cheat abilities: Health/Stamina/Eitr capacity and regens)
##
## 🛡️ Mod Update Protection (Override Files):
## To customize values without having mod updates overwrite your changes, create override files:
##     - Success.override.yml
##     - Drops.override.yml
##     - Item.override.yml
##     - Armor.override.yml
##     - Cheat.override.yml
## Values defined in override files automatically take precedence and support live Hot-Reload on save!
## =========================================================================================

[1. General & UI]

## Shortcut key to toggle the item enhancement window (e.g. F8, U, Insert).
# Setting type: KeyCode
# Default value: F8
ToggleGuiKey = F8

## Display tier-colored enhancement level badges (+X) on inventory icons.
# Setting type: Boolean
# Default value: true
ShowInventoryBadges = true
