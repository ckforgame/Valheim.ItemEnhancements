# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - ITEM & WEAPON ABILITIES CONFIGURATION
# หมวดหมู่อาวุธ, คุณสมบัติทั่วไป (ความทนทาน, น้ำหนัก) และเครื่องประดับ
# ====================================================================
# หากต้องการปรับแต่งค่าโดยไม่ให้การอัปเดต Mod ส่งผลกระทบ
# ให้สร้างไฟล์ "Item.override.yml" ในโฟลเดอร์เดียวกันนี้
# และใส่เฉพาะค่าที่ต้องการแก้ไข ระบบจะนำค่า override มาทับค่าเดิมอัตโนมัติ
# ====================================================================

# คุณสมบัติอาวุธ (Weapon Abilities)
WeaponDamageBonusPerLevel: 0.05       # โบนัสพลังโจมตีทุกประเภทต่อระดับ (0.05 = +5% ต่อระดับ, +100% ที่ +20)
WeaponBackstabBonusPerLevel: 0.05     # โบนัสตัวคูณ Backstab เพิ่มขึ้นต่อระดับ (+0.05x ต่อระดับ)
WeaponStaminaReductionPerLevel: 0.01  # ลดการใช้ Stamina โจมตีต่อระดับ (0.01 = -1% ต่อระดับ, สูงสุด -40%)
WeaponEitrReductionPerLevel: 0.01     # ลดการใช้ Eitr ร่ายมนตร์ต่อระดับ (0.01 = -1% ต่อระดับ, สูงสุด -40%)

# คุณสมบัติทั่วไป (General Item Abilities)
MaxDurabilityBonusPerLevel: 0.05      # เพิ่มความทนทานสูงสุดต่อระดับ (0.05 = +5% ต่อระดับ, +100% ที่ +20)
WeightReductionPerLevel: 0.015        # ลดน้ำหนักอุปกรณ์ต่อระดับ (0.015 = -1.5% ต่อระดับ, สูงสุด -60%)

# เครื่องประดับและยูทิลิตี้ (Utility & Accessories)
CarryWeightBonusPerLevel: 5.0         # เพิ่มน้ำหนักบรรทุกสูงสุดต่อระดับสำหรับเข็มขัด Megingjord (+5 ต่อระดับ, +100 ที่ +20)
