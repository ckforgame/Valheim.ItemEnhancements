# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - ITEM & WEAPON ABILITIES CONFIGURATION
# Weapons, tools, general durability/weight, and utility accessories
# ====================================================================
# [Calculation System: Cumulative Addition]
# - For each level, specify only the incremental value gained at that level.
# - As an item reaches higher enhancement levels, the system automatically sums
#   all values from level +1 up to the current level.
# - Example: If +1 grants WeaponAttackStamina: 2.0 and +3 grants WeaponAttackStamina: 2.0,
#   at level +3 the weapon has a cumulative -4.0% attack stamina cost.
# - If a level does not specify an ability, it retains the accumulated total from previous levels.
# ====================================================================
# [Custom Overrides]
# To customize values without having mod updates overwrite your changes,
# create a file named "Item.override.yml" in this same folder
# and specify only the levels you wish to override, for example:
#
# Levels:
#   1:
#     - Ability: WeaponDamage
#       Value: 15.0
# ====================================================================
# [Supported Ability IDs in this file]
# - Weapons: WeaponDamage, WeaponBackstab, WeaponAttackStamina, WeaponAttackEitr
# - General: MaxDurability, WeightReduction, CarryWeightBonus
# [Full Ability ID list → AbilityReference.txt]
# ====================================================================

Levels:
  # ------------------------------------------------------------------
  # Level +1: Basic stamina/eitr efficiency and durability
  # ------------------------------------------------------------------
  1:
    - Ability: WeaponAttackStamina
      Value: 2.0      # -2% Attack Stamina
    - Ability: WeaponAttackEitr
      Value: 2.0      # -2% Spell Eitr
    - Ability: MaxDurability
      Value: 5.0      # +5% Max Durability

  # ------------------------------------------------------------------
  # Level +2: Initial damage increase
