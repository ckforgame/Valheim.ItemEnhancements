      Value: 5.0      # สะสมดาเมจรวมเป็น +10%
    - Ability: ArmorPercent
      Value: 2.0      # พลังป้องกันเกราะ +2%
    - Ability: JumpStaminaReduction
      Value: 1.0      # ลด Stamina กระโดด 1%
    - Ability: WeaponBackstab
      Value: 5.0      # เพิ่มโบนัสแทงหลัง +0.05x (5%)

  # ------------------------------------------------------------------
  # Level +5: ★ MILESTONE: ปลดล็อกระบบ Parry & เข็มขัดแบกของ
  # ------------------------------------------------------------------
  5:
    - Ability: MaxDurability
      Value: 5.0      # สะสมความทนทานรวมเป็น +10%
    - Ability: ShieldDeflectionForce
      Value: 5.0      # เพิ่มแรงปัดป้อง 5%
    - Ability: ShieldTimedBlock
      Value: 2.0      # โบนัส Parry +0.02x
    - Ability: CarryWeightBonus
      Value: 10.0     # เพิ่มขีดจำกัดน้ำหนักบรรทุก +10
    # Cheat Abilities (ทำงานเมื่อเปิด EnableCheatAbilities)
    - Ability: CheatMaxHealth
      Value: 10.0
    - Ability: CheatMaxStamina
      Value: 10.0
    - Ability: CheatMaxEitr
      Value: 10.0

