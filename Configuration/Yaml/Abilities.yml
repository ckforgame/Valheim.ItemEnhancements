# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - ABILITIES BY LEVEL CONFIGURATION
# กำหนด Abilities และเปอร์เซ็นต์/ค่าพลัง ที่จะได้รับในแต่ละระดับ (Level 1 - 20)
# ====================================================================
# [คำอธิบายระบบการคำนวณ: ผลบวกสะสม (Cumulative Addition)]
# - แต่ละระดับ ให้ระบุเฉพาะค่าที่ "เพิ่มขึ้นในระดับนั้น" (Value หรือ Percent)
# - เมื่อไอเทมมีระดับตีบวกถึงระดับใด ระบบจะรวมผลสะสมตั้งแต่ +1 ถึงระดับนั้นให้อัตโนมัติ
# - ตัวอย่าง: หาก +1 ใส่ WeaponAttackStamina: 2.0 และ +3 ใส่ WeaponAttackStamina: 2.0
#   เมื่ออาวุธถึง +3 จะได้รับลด Stamina โจมตีรวม = 4.0%
# - หากระดับใดไม่ได้ระบุ Ability ใดไว้ จะยังคงได้ค่าสะสมของ Ability นั้นจากระดับก่อนหน้าต่อไป
# ====================================================================
# [การปรับแต่งส่วนตัวโดยไม่ให้การอัปเดต Mod ส่งผลกระทบ (Custom Override)]
# หากต้องการปรับแต่งเอง ให้สร้างไฟล์ "Abilities.override.yml" ในโฟลเดอร์เดียวกันนี้
# และใส่เฉพาะ Level ที่ต้องการเปลี่ยน เช่น:
#
# Levels:
#   1:
#     - Ability: WeaponDamage
#       Value: 15.0
#
# ระบบจะนำค่าใน Abilities.override.yml มาแทนที่เฉพาะระดับนั้น โดยระดับอื่นยังคงเดิม
# ====================================================================
# [รายชื่อ Ability ID ทั้งหมดที่รองรับ]
# - อาวุธ: WeaponDamage, WeaponBackstab, WeaponAttackStamina, WeaponAttackEitr
# - เกราะ: ArmorFlat, ArmorPercent, ArmorMovementPenaltyReduction, EitrRegen
# - โล่: ShieldBlockPower, ShieldDeflectionForce, ShieldTimedBlock, ShieldBlockStaminaReduction
# - ทั่วไป/คล่องตัว: MaxDurability, WeightReduction, DodgeStaminaReduction, RunStaminaReduction, JumpStaminaReduction, CarryWeightBonus
# - โหมดโกง (ทำงานเมื่อเปิด EnableCheatAbilities ใน Cheat.yml):
#   CheatMaxHealth, CheatMaxStamina, CheatMaxEitr, CheatHealthRegen, CheatStaminaRegen, CheatEitrRegen, CheatHealingMultiplier
# ====================================================================

Levels:
  # ------------------------------------------------------------------
  # Level +1: เน้นการบริหาร Stamina/Eitr พื้นฐาน และความทนทาน
  # ------------------------------------------------------------------
  1:
    - Ability: WeaponAttackStamina
      Value: 2.0      # ลด Stamina โจมตี 2%
    - Ability: WeaponAttackEitr
      Value: 2.0      # ลด Eitr ร่ายเวท 2%
    - Ability: MaxDurability
      Value: 5.0      # เพิ่มความทนทาน 5%
    - Ability: DodgeStaminaReduction
      Value: 1.0      # ลด Stamina กลิ้งหลบ 1%

  # ------------------------------------------------------------------
  # Level +2: เริ่มได้รับพลังโจมตี, เกราะคงที่ และพลังบล็อก
  # ------------------------------------------------------------------
  2:
    - Ability: WeaponDamage
      Value: 5.0      # โบนัสดาเมจ +5%
    - Ability: ArmorFlat
      Value: 1.5      # พลังป้องกันเกราะ +1.5
    - Ability: ShieldBlockPower
      Value: 5.0      # พลังบล็อกของโล่ +5%

  # ------------------------------------------------------------------
  # Level +3: ความคล่องตัว, วิ่งเหนื่อยน้อยลง และน้ำหนักเบา
