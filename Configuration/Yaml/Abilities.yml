  3:
    - Ability: WeaponAttackStamina
      Value: 2.0      # สะสม Stamina โจมตีรวมเป็น -4%
    - Ability: RunStaminaReduction
      Value: 1.0      # ลด Stamina วิ่ง 1%
    - Ability: ShieldBlockStaminaReduction
      Value: 2.0      # ลด Stamina บล็อก 2%
    - Ability: WeightReduction
      Value: 3.0      # ลดน้ำหนักอุปกรณ์ 3%

  # ------------------------------------------------------------------
  # Level +4: ดาเมจรอบสอง, เกราะคิดเป็น %, และท่าลอบสังหาร
  # ------------------------------------------------------------------
