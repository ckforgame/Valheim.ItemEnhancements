# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - CHEAT ABILITIES CONFIGURATION (โหมดโกงเสริม)
# หมวดหมู่ความสามารถพิเศษระดับโกง (เพิ่ม Capacity เลือด, สเตมินา, พลังเวท และรีเจนต่างๆ)
# ====================================================================
# [คำอธิบายระบบการคำนวณ: ผลบวกสะสม (Cumulative Addition)]
# - แต่ละระดับ ให้ระบุเฉพาะค่าที่ "เพิ่มขึ้นในระดับนั้น"
# - เมื่อไอเทมมีระดับตีบวกถึงระดับใด ระบบจะรวมผลสะสมตั้งแต่ +1 ถึงระดับนั้นให้อัตโนมัติ
# - Abilities ในไฟล์นี้จะทำงาน *เฉพาะเมื่อ* EnableCheatAbilities: true เท่านั้น
# ====================================================================
# หากต้องการปรับแต่งค่าโดยไม่ให้การอัปเดต Mod ส่งผลกระทบ
# ให้สร้างไฟล์ "Cheat.override.yml" ในโฟลเดอร์เดียวกันนี้
# และใส่เฉพาะค่าที่ต้องการแก้ไข ระบบจะนำค่า override มาทับค่าเดิมอัตโนมัติ
# ====================================================================
# [รายชื่อ Ability ID ที่รองรับในไฟล์นี้]
# - MaxHealth, MaxStamina, MaxEitr
# - HealthRegen, StaminaRegen, HealingMultiplier
# [ดูรายชื่อ Ability ID ทั้งหมด → AbilityReference.txt]
# ====================================================================

# เปิด/ปิด การใช้งานคุณสมบัติพิเศษระดับโกง (Toggle ON/OFF)
EnableCheatAbilities: false

Levels:
  # ------------------------------------------------------------------
  # Level +5: ★ MILESTONE: ปลดล็อกพลัง Cheat ครั้งแรก
  # ------------------------------------------------------------------
  5:
    - Ability: MaxHealth
      Value: 10.0     # เพิ่ม Max Health +10
    - Ability: MaxStamina
      Value: 10.0     # เพิ่ม Max Stamina +10
    - Ability: MaxEitr
      Value: 10.0     # เพิ่ม Max Eitr +10

  # ------------------------------------------------------------------
  # Level +10: ★ MILESTONE: Masterwork - ปลดล็อกระบบรีเจน
  # ------------------------------------------------------------------
  10:
    - Ability: HealthRegen
      Value: 10.0     # เพิ่มอัตราฟื้นฟู Health +10%
    - Ability: StaminaRegen
      Value: 10.0     # เพิ่มอัตราฟื้นฟู Stamina +10%

  # ------------------------------------------------------------------
  # Level +15: ★ MILESTONE: Legendary - โบนัสการฮีล
  # ------------------------------------------------------------------
  15:
    - Ability: HealingMultiplier
      Value: 15.0     # เพิ่มประสิทธิภาพการฮีล +15%
