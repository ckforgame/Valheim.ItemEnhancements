# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - CHEAT ABILITIES CONFIGURATION
# Optional cheat abilities: Health, Stamina, Eitr capacity and regeneration
# ====================================================================
# [Calculation System: Cumulative Addition]
# - For each level, specify only the incremental value gained at that level.
# - As an item reaches higher enhancement levels, the system automatically sums
#   all values from level +1 up to the current level.
# - Abilities in this file are active ONLY when EnableCheatAbilities: true.
# ====================================================================
# To customize values without having mod updates overwrite your changes,
# create a file named "Cheat.override.yml" in this same folder
# and specify only the values you wish to override.
# ====================================================================
# [Supported Ability IDs in this file]
# - MaxHealth, MaxStamina, MaxEitr
# - HealthRegen, StaminaRegen, HealingMultiplier
# [Full Ability ID list → AbilityReference.txt]
# ====================================================================

# Toggle ON/OFF cheat abilities globally
EnableCheatAbilities: false

Levels:
  # ------------------------------------------------------------------
  # Level +5: ★ MILESTONE: Initial Cheat Awakening
  # ------------------------------------------------------------------
  5:
    - Ability: MaxHealth
      Value: 10.0     # +10 Max Health
    - Ability: MaxStamina
      Value: 10.0     # +10 Max Stamina
    - Ability: MaxEitr
      Value: 10.0     # +10 Max Eitr

  # ------------------------------------------------------------------
  # Level +10: ★ MILESTONE: Masterwork - Regeneration Surge
  # ------------------------------------------------------------------
  10:
    - Ability: HealthRegen
      Value: 10.0     # +10% Health Regen Multiplier
    - Ability: StaminaRegen
      Value: 10.0     # +10% Stamina Regen Multiplier

  # ------------------------------------------------------------------
  # Level +15: ★ MILESTONE: Legendary - Healing Amplification
  # ------------------------------------------------------------------
  15:
    - Ability: HealingMultiplier
      Value: 15.0     # +15% Healing Received Multiplier
