# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - CHEAT ABILITIES CONFIGURATION (โหมดโกงเสริม)
# หมวดหมู่ความสามารถพิเศษระดับโกง (เพิ่ม Capacity เลือด, สเตมินา, พลังเวท และรีเจนต่างๆ)
# ====================================================================
# หากต้องการปรับแต่งค่าโดยไม่ให้การอัปเดต Mod ส่งผลกระทบ
# ให้สร้างไฟล์ "Cheat.override.yml" ในโฟลเดอร์เดียวกันนี้
# และใส่เฉพาะค่าที่ต้องการแก้ไข ระบบจะนำค่า override มาทับค่าเดิมอัตโนมัติ
# ====================================================================

# เปิด/ปิด การใช้งานคุณสมบัติพิเศษระดับโกง (Toggle ON/OFF)
EnableCheatAbilities: false

# ความจุสเตตัสสูงสุด (Max Capacities per Level)
CheatMaxHealthPerLevel: 5.0           # เพิ่มค่าพลังชีวิตสูงสุด (Max Health) ต่อระดับ (+5 ต่อระดับ, +100 ที่ +20)
CheatMaxStaminaPerLevel: 5.0          # เพิ่มค่า Stamina สูงสุด (Max Stamina) ต่อระดับ (+5 ต่อระดับ, +100 ที่ +20)
CheatMaxEitrPerLevel: 5.0             # เพิ่มค่า Eitr สูงสุด (Max Eitr) ต่อระดับ (+5 ต่อระดับ, +100 ที่ +20)

# อัตราการฟื้นฟูและการฮีล (Regenerations & Healing per Level)
CheatHealthRegenPerLevel: 0.05        # เพิ่มอัตราการฟื้นฟูพลังชีวิตต่อระดับ (0.05 = +5% ต่อระดับ, +100% ที่ +20)
CheatStaminaRegenPerLevel: 0.05       # เพิ่มอัตราการฟื้นฟู Stamina ต่อระดับ (0.05 = +5% ต่อระดับ, +100% ที่ +20)
CheatEitrRegenPerLevel: 0.05          # เพิ่มอัตราการฟื้นฟู Eitr ต่อระดับ (0.05 = +5% ต่อระดับ, +100% ที่ +20)
CheatHealingMultiplierPerLevel: 0.05  # เพิ่มประสิทธิภาพการฮีลที่ได้รับทั้งหมดต่อระดับ (0.05 = +5% ต่อระดับ, +100% ที่ +20)
