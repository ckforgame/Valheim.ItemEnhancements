# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - MONSTER SCROLL DROPS CONFIGURATION
# Detailed drop rates for enhancement scrolls from monsters and bosses
# ====================================================================
# To customize values without having mod updates overwrite your changes,
# create a file named "Drops.override.yml" in this same folder
# and specify only the values you wish to override.
# ====================================================================

EnableMonsterDrops: true          # Enable enhancement scroll drops when slaying monsters
StarLevelMultiplier: 1.5          # Drop rate multiplier per monster star level (1 star = 1.5x, 2 star = 2.0x)

# --------------------------------------------------------------------
# 1. Drop rates by Biome and Scroll Tier (%)
# --------------------------------------------------------------------
# Each biome can configure drop chance (%) for Tier 1 through Tier 4 independently.
# (A value of 0.0 means that tier cannot drop in the given biome)
BiomeDrops:
  Meadows:
    Tier1: 15.0
    Tier2: 0.0
    Tier3: 0.0
    Tier4: 0.0
  BlackForest:
    Tier1: 15.0
    Tier2: 3.0
    Tier3: 0.0
    Tier4: 0.0
  Swamp:
    Tier1: 5.0
    Tier2: 10.0
    Tier3: 0.0
    Tier4: 0.0
  Mountain:
    Tier1: 0.0
    Tier2: 10.0
    Tier3: 3.0
    Tier4: 0.0
  Plains:
    Tier1: 0.0
    Tier2: 2.0
    Tier3: 6.0
    Tier4: 0.0
  Mistlands:
    Tier1: 0.0
    Tier2: 0.0
    Tier3: 6.0
    Tier4: 2.0
  AshLands:
    Tier1: 0.0
    Tier2: 0.0
    Tier3: 1.0
    Tier4: 3.0
  DeepNorth:
    Tier1: 0.0
    Tier2: 0.0
    Tier3: 0.0
    Tier4: 5.0
  Ocean:
    Tier1: 5.0
    Tier2: 10.0
    Tier3: 0.0
    Tier4: 0.0

# --------------------------------------------------------------------
# 2. Elite Monsters & Minibosses (e.g. Troll, Golem, Abomination, Gjall)
# --------------------------------------------------------------------
EliteDrops:
  BonusMultiplier: 2.0            # Drop rate multiplier for elite monsters
  TierUpgradeChance: 25.0         # Chance (%) to upgrade scroll to next tier

# --------------------------------------------------------------------
# 3. World Bosses
# --------------------------------------------------------------------
BossDrops:
  GuaranteedDrop: true            # World bosses guarantee a 100% scroll drop
  MinAmount: 1                    # Minimum scroll drop count
  MaxAmount: 3                    # Maximum scroll drop count
  BossTiers:
    Eikthyr: 1
    Elder: 2
    Bonemass: 2
    Moder: 3
    Yagluth: 3
    Queen: 4
    Fader: 4
