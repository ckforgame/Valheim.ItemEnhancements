# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - MONSTER SCROLL DROPS CONFIGURATION
# หมวดหมู่อัตราการดรอปม้วนคัมภีร์จากมอนสเตอร์และบอสอย่างละเอียด
# ====================================================================
# หากต้องการปรับแต่งค่าโดยไม่ให้การอัปเดต Mod ส่งผลกระทบ
# ให้สร้างไฟล์ "Drops.override.yml" ในโฟลเดอร์เดียวกันนี้
# และใส่เฉพาะค่าที่ต้องการแก้ไข ระบบจะนำค่า override มาทับค่าเดิมอัตโนมัติ
# ====================================================================

EnableMonsterDrops: true          # เปิดใช้งานการดรอปม้วนคัมภีร์เมื่อสังหารมอนสเตอร์
StarLevelMultiplier: 1.5          # ตัวคูณโอกาสดรอปต่อระดับดาวมอนสเตอร์ (1 ดาว = 1.5x, 2 ดาว = 2.0x)

# --------------------------------------------------------------------
# 1. อัตราการดรอปแยกตาม Biome และ Tier ของคัมภีร์ (%)
# --------------------------------------------------------------------
# ในแต่ละ Biome สามารถตั้งค่าโอกาสดรอป (% Drop Chance) ของคัมภีร์ Tier 1 ถึง Tier 4 ได้อย่างอิสระ
# (ค่า 0.0 คือไม่ดรอปคัมภีร์เทียร์นั้นใน Biome ดังกล่าว)
BiomeDrops:
  Meadows:
    Tier1: 15.0
    Tier2: 0.0
    Tier3: 0.0
    Tier4: 0.0
  BlackForest:
    Tier1: 15.0
    Tier2: 3.0
    Tier3: 0.0
    Tier4: 0.0
  Swamp:
    Tier1: 5.0
    Tier2: 10.0
    Tier3: 0.0
    Tier4: 0.0
  Mountain:
    Tier1: 0.0
    Tier2: 10.0
    Tier3: 3.0
    Tier4: 0.0
  Plains:
    Tier1: 0.0
    Tier2: 2.0
    Tier3: 6.0
    Tier4: 0.0
  Mistlands:
    Tier1: 0.0
    Tier2: 0.0
    Tier3: 6.0
    Tier4: 2.0
  AshLands:
    Tier1: 0.0
    Tier2: 0.0
    Tier3: 1.0
    Tier4: 3.0
  DeepNorth:
    Tier1: 0.0
    Tier2: 0.0
    Tier3: 0.0
    Tier4: 5.0
  Ocean:
    Tier1: 5.0
    Tier2: 10.0
    Tier3: 0.0
    Tier4: 0.0

# --------------------------------------------------------------------
# 2. มอนสเตอร์ชั้นสูง / มินิบอส (Elite Monsters เช่น Troll, Golem, Abomination, Gjall)
# --------------------------------------------------------------------
EliteDrops:
  BonusMultiplier: 2.0            # ตัวคูณเพิ่มโอกาสดรอปสำหรับมอนสเตอร์ระดับสูง
  TierUpgradeChance: 25.0         # โอกาส (%) ที่จะอัปเกรดเป็นคัมภีร์ Tier ถัดไป

# --------------------------------------------------------------------
# 3. บอสโลก (World Bosses)
# --------------------------------------------------------------------
BossDrops:
  GuaranteedDrop: true            # บอสโลกการันตีการดรอป 100%
  MinAmount: 1                    # จำนวนดรอปขั้นต่ำ
  MaxAmount: 3                    # จำนวนดรอปสูงสุด
  BossTiers:
    Eikthyr: 1
    Elder: 2
    Bonemass: 2
    Moder: 3
    Yagluth: 3
    Queen: 4
    Fader: 4
