# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - SUCCESS & RULES CONFIGURATION
# หมวดหมู่อัตราความสำเร็จ, กฎการล้มเหลว, ค่าธรรมเนียม และการดรอปคัมภีร์
# ====================================================================
# หากต้องการปรับแต่งค่าโดยไม่ให้การอัปเดต Mod ส่งผลกระทบ
# ให้สร้างไฟล์ "Success.override.yml" ในโฟลเดอร์เดียวกันนี้
# และใส่เฉพาะค่าที่ต้องการแก้ไข ระบบจะนำค่า override มาทับค่าเดิมอัตโนมัติ
# ====================================================================

# อัตราความสำเร็จสำหรับการตีบวกขึ้นเป็นระดับ +1 ถึง +20 (%)
SuccessRates:
  Level_01: 100.0
  Level_02: 100.0
  Level_03: 95.0
  Level_04: 90.0
  Level_05: 80.0
  Level_06: 70.0
  Level_07: 60.0
  Level_08: 50.0
  Level_09: 40.0
  Level_10: 35.0
  Level_11: 30.0
  Level_12: 25.0
  Level_13: 20.0
  Level_14: 15.0
  Level_15: 12.0
  Level_16: 10.0
  Level_17: 8.0
  Level_18: 5.0
  Level_19: 3.0
  Level_20: 1.0

# กฎการล้มเหลว (Failure Mechanics)
SafeLevel: 3                      # ระดับปลอดภัย (ไม่ลดระดับและไม่แตก)
DowngradeOnFail: true             # หากล้มเหลวเกินระดับปลอดภัย จะลดระดับลง 1 ขั้น
BreakOnFail: false                # หากล้มเหลวเกินระดับปลอดภัย มีโอกาสไอเทมแตกสลาย
BreakChanceAboveSafeLevel: 10.0   # โอกาสแตก (%) หากเปิดใช้งาน BreakOnFail

# ค่าธรรมเนียมและข้อกำหนด (Costs & Requirements)
RequireCoins: false               # ต้องใช้เหรียญทองในการตีบวกหรือไม่ (false = ฟรีค่าธรรมเนียม)
CoinsBaseCost: 0                  # ค่าธรรมเนียมทองพื้นฐาน
CoinsPerLevelIncrement: 0.0       # ค่าธรรมเนียมทองที่เพิ่มขึ้นต่อระดับเป้าหมาย
RequireCraftingStation: true      # ต้องอยู่ใกล้โต๊ะคราฟต์หรือเตาตีเหล็กเพื่อเปิดหน้าต่างตีบวก
CraftingStationRange: 5.0         # รัศมีระยะห่างจากโต๊ะคราฟต์ (เมตร) ที่อนุญาตให้เปิดได้ (เช่น 5.0m = ยืนหน้าโต๊ะ/ข้างโต๊ะ, 15.0m = ทั่วห้องช่าง)

# ม้วนคัมภีร์ตีบวก (Enhancement Scrolls Requirements)
RequireScrolls: true              # ต้องใช้ม้วนคัมภีร์ตามระดับในการตีบวกหรือไม่
ScrollsRequiredPerAttempt: 1      # จำนวนคัมภีร์ที่ใช้ต่อการกด 1 ครั้ง
