# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - SUCCESS & RULES CONFIGURATION
# Success rates, failure penalties, coin fees, and scroll requirements
# ====================================================================
# To customize values without having mod updates overwrite your changes,
# create a file named "Success.override.yml" in this same folder
# and specify only the values you wish to override.
# ====================================================================

# Success rate for attempting each level from +1 to +20 (%)
SuccessRates:
  Level_01: 100.0
  Level_02: 100.0
  Level_03: 95.0
  Level_04: 90.0
  Level_05: 80.0
  Level_06: 70.0
  Level_07: 60.0
  Level_08: 50.0
  Level_09: 40.0
  Level_10: 35.0
  Level_11: 30.0
  Level_12: 25.0
  Level_13: 20.0
  Level_14: 15.0
  Level_15: 12.0
  Level_16: 10.0
  Level_17: 8.0
  Level_18: 5.0
  Level_19: 3.0
  Level_20: 1.0

# Failure Mechanics
SafeLevel: 3                      # Safe level: failures at or below this level do not downgrade or break
DowngradeOnFail: true             # If failed above safe level, downgrades level by 1
BreakOnFail: false                # If failed above safe level, item has a chance to break
BreakChanceAboveSafeLevel: 10.0   # Break chance (%) if BreakOnFail is enabled

# Costs & Requirements
RequireCoins: false               # Require coins to enhance (false = free of coin fees)
CoinsBaseCost: 0                  # Base coin fee per attempt
CoinsPerLevelIncrement: 0.0       # Additional coin fee scaling per target level
RequireCraftingStation: true      # Require nearby workbench or forge to open enhancement window
CraftingStationRange: 5.0         # Allowed range (meters) to crafting station (e.g. 5.0m = at station, 15.0m = entire workshop)

# Enhancement Scrolls Requirements
RequireScrolls: true              # Require tier-appropriate enhancement scrolls to attempt
ScrollsRequiredPerAttempt: 1      # Number of scrolls consumed per attempt
