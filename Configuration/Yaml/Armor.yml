# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - ARMOR & SHIELD ABILITIES CONFIGURATION
# หมวดหมู่ชุดเกราะ, โล่ และความคล่องตัว (Mobility)
# ====================================================================
# [คำอธิบายระบบการคำนวณ: ผลบวกสะสม (Cumulative Addition)]
# - แต่ละระดับ ให้ระบุเฉพาะค่าที่ "เพิ่มขึ้นในระดับนั้น" (Value หรือ Percent)
# - เมื่อไอเทมมีระดับตีบวกถึงระดับใด ระบบจะรวมผลสะสมตั้งแต่ +1 ถึงระดับนั้นให้อัตโนมัติ
# - หากระดับใดไม่ได้ระบุ Ability ใดไว้ จะยังคงได้ค่าสะสมของ Ability นั้นจากระดับก่อนหน้าต่อไป
# ====================================================================
# [การปรับแต่งส่วนตัวโดยไม่ให้การอัปเดต Mod ส่งผลกระทบ (Custom Override)]
# หากต้องการปรับแต่งเอง ให้สร้างไฟล์ "Armor.override.yml" ในโฟลเดอร์เดียวกันนี้
# และใส่เฉพาะ Level ที่ต้องการเปลี่ยน เช่น:
#
# Levels:
#   2:
#     - Ability: ArmorFlat
#       Value: 3.0
#
# ระบบจะนำค่าใน Armor.override.yml มาแทนที่เฉพาะระดับนั้น โดยระดับอื่นยังคงเดิม
# ====================================================================
# [รายชื่อ Ability ID ที่รองรับในไฟล์นี้]
# - เกราะ: ArmorFlat, ArmorPercent, ArmorMovementPenaltyReduction, EitrRegen
# - โล่: ShieldBlockPower, ShieldDeflectionForce, ShieldTimedBlock, ShieldBlockStaminaReduction
# - ความคล่องตัว: DodgeStaminaReduction, RunStaminaReduction, JumpStaminaReduction
# [ดูรายชื่อ Ability ID ทั้งหมด → AbilityReference.txt]
# ====================================================================

Levels:
  # ------------------------------------------------------------------
  # Level +1: ลดการใช้ Stamina กลิ้งหลบเริ่มต้น
  # ------------------------------------------------------------------
  1:
    - Ability: DodgeStaminaReduction
      Value: 1.0      # ลด Stamina กลิ้งหลบ 1%

  # ------------------------------------------------------------------
  # Level +2: เริ่มได้รับเกราะคงที่ และพลังบล็อก
  # ------------------------------------------------------------------
  2:
    - Ability: ArmorFlat
      Value: 1.5      # พลังป้องกันเกราะ +1.5
    - Ability: ShieldBlockPower
      Value: 5.0      # พลังบล็อกของโล่ +5%

  # ------------------------------------------------------------------
  # Level +3: วิ่งเหนื่อยน้อยลง และลดการใช้ Stamina บล็อก
  # ------------------------------------------------------------------
  3:
    - Ability: RunStaminaReduction
      Value: 1.0      # ลด Stamina วิ่ง 1%
    - Ability: ShieldBlockStaminaReduction
      Value: 2.0      # ลด Stamina บล็อก 2%

  # ------------------------------------------------------------------
  # Level +4: เกราะ % และลดกระโดด
  # ------------------------------------------------------------------
  4:
    - Ability: ArmorPercent
      Value: 2.0      # พลังป้องกันเกราะ +2%
    - Ability: JumpStaminaReduction
      Value: 1.0      # ลด Stamina กระโดด 1%

  # ------------------------------------------------------------------
  # Level +5: ★ MILESTONE: ปลดล็อกระบบ Parry
  # ------------------------------------------------------------------
  5:
    - Ability: ShieldDeflectionForce
      Value: 5.0      # เพิ่มแรงปัดป้อง 5%
    - Ability: ShieldTimedBlock
      Value: 2.0      # โบนัส Parry +0.02x

  # ------------------------------------------------------------------
  # Level +6: พลังรับขั้นกลาง
  # ------------------------------------------------------------------
  6:
    - Ability: ArmorFlat
      Value: 1.5      # สะสมเกราะคงที่รวมเป็น +3.0
    - Ability: ShieldBlockPower
      Value: 5.0      # สะสมพลังบล็อกรวมเป็น +10%

  # ------------------------------------------------------------------
  # Level +7: กลิ้งหลบคล่อง
  # ------------------------------------------------------------------
  7:
    - Ability: DodgeStaminaReduction
      Value: 1.0      # สะสม Stamina กลิ้งหลบรวมเป็น -2%

  # ------------------------------------------------------------------
  # Level +8: เกราะหนา
  # ------------------------------------------------------------------
  8:
    - Ability: ArmorPercent
      Value: 2.0      # สะสมเกราะเปอร์เซ็นต์รวมเป็น +4%

  # ------------------------------------------------------------------
  # Level +9: กำแพงเหล็ก - พลังป้องกันโล่และการบล็อก
  # ------------------------------------------------------------------
  9:
    - Ability: ShieldBlockPower
      Value: 5.0      # สะสมพลังบล็อกรวมเป็น +15%
    - Ability: ShieldBlockStaminaReduction
      Value: 2.0      # สะสมลด Stamina บล็อกรวมเป็น -4%
    - Ability: RunStaminaReduction
      Value: 1.0      # สะสม Stamina วิ่งรวมเป็น -2%

  # ------------------------------------------------------------------
  # Level +10: ★ MILESTONE: Masterwork - สลัดความเชื่องช้า & ฟื้นฟูเวท
  # ------------------------------------------------------------------
  10:
    - Ability: ArmorMovementPenaltyReduction
      Value: 15.0     # ลดโทษความเร็วเดิน 15%
    - Ability: EitrRegen
      Value: 10.0     # เพิ่มอัตราฟื้นฟู Eitr 10%

  # ------------------------------------------------------------------
  # Level +11: ก้าวสู่อุปกรณ์ระดับสูง (Elite Tier)
  # ------------------------------------------------------------------
  11:
    - Ability: ArmorFlat
      Value: 2.0      # สะสมเกราะคงที่รวมเป็น +5.0

  # ------------------------------------------------------------------
  # Level +12: บล็อกแน่น
  # ------------------------------------------------------------------
  12:
    - Ability: ShieldBlockPower
      Value: 5.0      # สะสมพลังบล็อกรวมเป็น +20%

  # ------------------------------------------------------------------
  # Level +13: พลังการปกป้อง
  # ------------------------------------------------------------------
  13:
    - Ability: ArmorPercent
      Value: 2.0      # สะสมเกราะเปอร์เซ็นต์รวมเป็น +6%
    - Ability: JumpStaminaReduction
      Value: 1.0      # สะสม Stamina กระโดดรวมเป็น -2%

  # ------------------------------------------------------------------
  # Level +14: การปัดป้องไร้ช่องโหว่ & กลิ้งพลิ้ว
  # ------------------------------------------------------------------
  14:
    - Ability: ShieldTimedBlock
      Value: 2.0      # สะสม Parry รวมเป็น +0.04x
    - Ability: DodgeStaminaReduction
      Value: 1.0      # สะสม Stamina กลิ้งหลบรวมเป็น -3%

  # ------------------------------------------------------------------
  # Level +15: ★ MILESTONE: Legendary - วิ่งไวไร้โทษ
  # ------------------------------------------------------------------
  15:
    - Ability: ArmorMovementPenaltyReduction
      Value: 20.0     # ลดโทษเดินช้าเพิ่ม 20% (เริ่มได้โบนัสสปีด)
    - Ability: ShieldDeflectionForce
      Value: 5.0      # สะสมแรงปัดป้องรวมเป็น +10%

  # ------------------------------------------------------------------
  # Level +16: สู่ระดับตำนาน (Mythic Tier)
  # ------------------------------------------------------------------
  16:
    - Ability: ArmorFlat
      Value: 2.0      # สะสมเกราะคงที่รวมเป็น +7.0

  # ------------------------------------------------------------------
  # Level +17: การบล็อกระดับเทพ
  # ------------------------------------------------------------------
  17:
    - Ability: ShieldBlockPower
      Value: 5.0      # สะสมพลังบล็อกรวมเป็น +25%

  # ------------------------------------------------------------------
  # Level +18: เกราะขั้นสุดยอด
  # ------------------------------------------------------------------
  18:
    - Ability: ArmorPercent
      Value: 2.0      # สะสมเกราะเปอร์เซ็นต์รวมเป็น +8%

  # ------------------------------------------------------------------
  # Level +19: ปัดป้องขั้นเทพ & ฟื้นฟู Eitr
  # ------------------------------------------------------------------
  19:
    - Ability: ShieldTimedBlock
      Value: 2.0      # สะสม Parry รวมเป็น +0.06x
    - Ability: EitrRegen
      Value: 10.0     # สะสม Eitr Regen รวมเป็น +20%

  # ------------------------------------------------------------------
  # Level +20: ★ ULTIMATE AWAKENING: จุดสูงสุดของพลังป้องกัน
  # ------------------------------------------------------------------
  20:
    - Ability: ArmorFlat
      Value: 3.0      # รวมโบนัสเกราะคงที่สะสมทั้งหมด = +10.0
    - Ability: ArmorMovementPenaltyReduction
      Value: 25.0     # ลบล้างโทษเดินช้าทั้งหมด 100% พร้อมโบนัสวิ่งไว
