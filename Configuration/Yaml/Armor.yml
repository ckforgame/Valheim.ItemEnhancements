# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - ARMOR & SHIELD ABILITIES CONFIGURATION
# Armor, shields, and player mobility modifiers
# ====================================================================
# [Calculation System: Cumulative Addition]
# - For each level, specify only the incremental value gained at that level.
# - As an item reaches higher enhancement levels, the system automatically sums
#   all values from level +1 up to the current level.
# - If a level does not specify an ability, it retains the accumulated total from previous levels.
# ====================================================================
# [Custom Overrides]
# To customize values without having mod updates overwrite your changes,
# create a file named "Armor.override.yml" in this same folder
# and specify only the levels you wish to override, for example:
#
# Levels:
#   2:
#     - Ability: ArmorFlat
#       Value: 3.0
# ====================================================================
# [Supported Ability IDs in this file]
# - Armor: ArmorFlat, ArmorPercent, ArmorMovementPenaltyReduction, EitrRegen
# - Shields: ShieldBlockPower, ShieldDeflectionForce, ShieldTimedBlock, ShieldBlockStaminaReduction
# - Mobility: DodgeStaminaReduction, RunStaminaReduction, JumpStaminaReduction
# [Full Ability ID list → AbilityReference.txt]
# ====================================================================

Levels:
  # ------------------------------------------------------------------
  # Level +1: Initial dodge roll stamina reduction
  # ------------------------------------------------------------------
  1:
    - Ability: DodgeStaminaReduction
      Value: 1.0      # -1% Dodge Stamina

  # ------------------------------------------------------------------
  # Level +2: Initial flat armor and shield block power
  # ------------------------------------------------------------------
  2:
    - Ability: ArmorFlat
      Value: 1.5      # +1.5 Flat Armor
    - Ability: ShieldBlockPower
      Value: 5.0      # +5% Shield Block Power

  # ------------------------------------------------------------------
  # Level +3: Sprinting and shield block stamina efficiency
  # ------------------------------------------------------------------
  3:
    - Ability: RunStaminaReduction
      Value: 1.0      # -1% Run Stamina
    - Ability: ShieldBlockStaminaReduction
      Value: 2.0      # -2% Block Stamina

  # ------------------------------------------------------------------
  # Level +4: Percentage armor and jump stamina reduction
  # ------------------------------------------------------------------
  4:
    - Ability: ArmorPercent
      Value: 2.0      # +2% Armor
    - Ability: JumpStaminaReduction
      Value: 1.0      # -1% Jump Stamina

  # ------------------------------------------------------------------
  # Level +5: ★ MILESTONE: Parry window & deflection bonus
  # ------------------------------------------------------------------
  5:
    - Ability: ShieldDeflectionForce
      Value: 5.0      # +5% Deflection Force
    - Ability: ShieldTimedBlock
      Value: 2.0      # +0.02x Parry Bonus

  # ------------------------------------------------------------------
  # Level +6: Mid-tier defensive reinforcement
  # ------------------------------------------------------------------
  6:
    - Ability: ArmorFlat
      Value: 1.5      # Cumulative +3.0 Flat Armor
    - Ability: ShieldBlockPower
      Value: 5.0      # Cumulative +10% Shield Block Power

  # ------------------------------------------------------------------
  # Level +7: Agile evasion
  # ------------------------------------------------------------------
  7:
    - Ability: DodgeStaminaReduction
      Value: 1.0      # Cumulative -2% Dodge Stamina

  # ------------------------------------------------------------------
  # Level +8: Heavy armor enhancement
  # ------------------------------------------------------------------
  8:
    - Ability: ArmorPercent
      Value: 2.0      # Cumulative +4% Armor

  # ------------------------------------------------------------------
  # Level +9: Bulwark - Shield defense and block endurance
  # ------------------------------------------------------------------
  9:
    - Ability: ShieldBlockPower
      Value: 5.0      # Cumulative +15% Shield Block Power
    - Ability: ShieldBlockStaminaReduction
      Value: 2.0      # Cumulative -4% Block Stamina
    - Ability: RunStaminaReduction
      Value: 1.0      # Cumulative -2% Run Stamina

  # ------------------------------------------------------------------
  # Level +10: ★ MILESTONE: Masterwork - Movement penalty relief & Eitr regen
  # ------------------------------------------------------------------
  10:
