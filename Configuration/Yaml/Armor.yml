# ====================================================================
# VALHEIM ITEM ENHANCEMENTS - ARMOR & SHIELD ABILITIES CONFIGURATION
# หมวดหมู่ชุดเกราะ, โล่ และความคล่องตัว (Mobility)
# ====================================================================
# หากต้องการปรับแต่งค่าโดยไม่ให้การอัปเดต Mod ส่งผลกระทบ
# ให้สร้างไฟล์ "Armor.override.yml" ในโฟลเดอร์เดียวกันนี้
# และใส่เฉพาะค่าที่ต้องการแก้ไข ระบบจะนำค่า override มาทับค่าเดิมอัตโนมัติ
# ====================================================================

# คุณสมบัติชุดเกราะ (Armor Abilities)
ArmorFlatBonusPerLevel: 1.5                   # พลังป้องกันเกราะคงที่เพิ่มขึ้นต่อระดับ (+1.5 ต่อระดับ, +30 ที่ +20)
ArmorPercentBonusPerLevel: 0.02               # พลังป้องกันเกราะแบบ % ต่อระดับ (0.02 = +2% ต่อระดับ, +40% ที่ +20)
ArmorMovementPenaltyReductionPerLevel: 0.05   # ลดโทษติดลบความเร็วเดินของเกราะหนักต่อระดับ (0.05 = ลดโทษลง 5% ต่อระดับ)
EitrRegenBonusPerLevel: 0.02                  # เพิ่มอัตราฟื้นฟู Eitr ต่อระดับสำหรับชุดนักเวท (0.02 = +2% ต่อระดับ)

# คุณสมบัติโล่ (Shield Abilities)
ShieldBlockPowerBonusPerLevel: 0.05           # โบนัสพลังบล็อกของโล่ต่อระดับ (0.05 = +5% ต่อระดับ, +100% ที่ +20)
ShieldDeflectionBonusPerLevel: 0.05           # โบนัสแรงปัดป้องต่อระดับ (0.05 = +5% ต่อระดับ)
ShieldTimedBlockBonusPerLevel: 0.02           # โบนัสตัวคูณ Parry เมื่อบล็อกตรงจังหวะต่อระดับ (+0.02x ต่อระดับ)
ShieldBlockStaminaReductionPerLevel: 0.015    # ลด Stamina ที่ใช้ในการบล็อกต่อระดับ (0.015 = -1.5% ต่อระดับ, สูงสุด -50%)

# ความคล่องตัวและการเคลื่อนที่ (Mobility & Stamina Reductions)
DodgeStaminaReductionPerLevel: 0.01           # ลด Stamina ในการกลิ้งหลบต่อระดับ (0.01 = -1% ต่อระดับ, สูงสุด -40%)
RunStaminaReductionPerLevel: 0.005            # ลด Stamina ในการวิ่งสปรินต์ต่อระดับ (0.005 = -0.5% ต่อระดับ, สูงสุด -30%)
JumpStaminaReductionPerLevel: 0.005           # ลด Stamina ในการกระโดดต่อระดับ (0.005 = -0.5% ต่อระดับ, สูงสุด -30%)
